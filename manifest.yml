
modules:
  confluence:globalPage:
    - key: minerva-adr-forge-hello-world-global-page
      resource: main
      render: native
      resolver:
        function: resolver
      title: Minerva-ADR-Forge
      route: hello-world

  function:
    - key: resolver
      handler: index.handler
      providers:
        auth:
          - google

    - key: run-migration
      handler: index.runMigration

  scheduledTrigger:
    - key: sql-schema-migration
      function: run-migration
      interval: fiveMinute

  sql:
    - key: minerva-adr-sql
      engine: mysql

resources:
  - key: main
    path: src/frontend/index.jsx

providers:
  auth:
    - key: google
      name: Google
      scopes:
        - https://www.googleapis.com/auth/drive.readonly
        - https://www.googleapis.com/auth/userinfo.email
      type: oauth2
      clientId: 688943911464-9uo4fkcajn8i1b72t68hlev6gk4peqqp.apps.googleusercontent.com
      remotes:
        - google-apis
      bearerMethod: authorization-header
      actions:
        authorization:
          remote: google-account
          path: /o/oauth2/v2/auth
          queryParameters:
            access_type: offline
        exchange:
          remote: google-oauth
          path: /token
        refreshToken:
          remote: google-oauth
          path: /token
        revokeToken:
          remote: google-oauth
          path: /revoke
        retrieveProfile:
          remote: google-apis
          path: /userinfo/v2/me
          resolvers:
            id: id
            displayName: email
            avatarUrl: picture

remotes:
  - key: google-apis
    baseUrl: https://www.googleapis.com
  - key: google-account
    baseUrl: https://accounts.google.com
  - key: google-oauth
    baseUrl: https://oauth2.googleapis.com

permissions:
  external:
    fetch:
      backend:
        - address: https://www.googleapis.com
        - address: https://accounts.google.com
        - address: https://oauth2.googleapis.com

app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/0956bba1-12a7-4958-a0f4-2c10045f3726
